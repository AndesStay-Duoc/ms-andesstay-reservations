name: CI

# Compila y prueba en cada cambio. Hasta ahora no habia ninguna comprobacion automatica: los
# tests solo corrian si alguien los lanzaba a mano, de modo que una rama podia llegar a develop
# sin compilar siquiera. Esto es el minimo que cierra ese hueco.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cachea ~/.m2 entre ejecuciones: sin esto cada build vuelve a descargar las dependencias.
          cache: maven

      - name: Compilar y probar
        run: mvn -B --no-transfer-progress verify
