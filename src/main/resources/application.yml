server:
  port: 8081

spring:
  application:
    name: ms-andesstay-reservations

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/andesstay?useSSL=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASS:}
    virtual-host: ${RABBITMQ_VHOST:andesstay}

    # Publisher confirms y returns. Sin esto la publicación es "dispara y olvida" desde el punto de
    # vista del broker: un mensaje con una routing key sin binding se descarta en silencio y este
    # servicio nunca se entera. Los callbacks están en config/RabbitMQConfig.java.
    #
    # Se usa el modo "correlated" y no "simple" porque el publicador adjunta un CorrelationData con
    # el eventId: así un nack del broker dice QUÉ mensaje rechazó.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

    # Ya no se declara listener.simple.acknowledge-mode: este servicio no tiene ningún
    # @RabbitListener, así que la propiedad no hacía nada.

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Sin broker alcanzable, send() bloquea buscando la metadata del clúster.
        # El valor por defecto son 60 s, que dejaría colgada la petición HTTP.
        # Es una red de seguridad por si se reactiva andesstay.events.enabled sin
        # haber levantado Kafka.
        max.block.ms: 2000

  security:
    oauth2:
      resourceserver:
        jwt:
          # Firma (JWKS), vigencia, issuer y audience del JWT de Azure AD
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/discovery/v2.0/keys
          # Azure AD puede emitir aud como api://<clientId> o como el GUID del clientId
          audiences:
            - api://${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}
            - ${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}

andesstay:
  # Publicación de eventos. Una bandera POR BROKER, no una compartida.
  #
  # Antes había una sola, andesstay.events.enabled, y eso ataba los dos: activar las colas de
  # RabbitMQ revivía el productor de Kafka contra un clúster que no existe, sumando los 2 s de
  # max.block.ms a cada escritura de reserva y llenando el log de errores.
  events:
    rabbit:
      enabled: ${ANDESSTAY_EVENTS_RABBIT_ENABLED:true}
    kafka:
      # En false hasta que el clúster de Kafka exista. Las reservas se persisten en MySQL con
      # normalidad y report y audit siguen sirviendo lo que ya tengan.
      enabled: ${ANDESSTAY_EVENTS_KAFKA_ENABLED:false}
  azure:
    client-id: ${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://catalog-svc:8082}
  rabbitmq:
    # Mismo esquema y mismos nombres que andesstay.rabbitmq en ms-andesstay-notify: son la única
    # fuente de los nombres en este servicio; el código los lee de aquí.
    #
    # Los tres exchanges se declaran en config/RabbitMQConfig.java. Las colas y los bindings los
    # declara ms-andesstay-notify, que es quien consume: una cola declarada dos veces con
    # argumentos distintos falla con PRECONDITION_FAILED.
    exchange:
      direct: cmd.direct
      topic: cmd.topic
      dlx: cmd.dead.dlx
    # Routing keys de los tres comandos. El contrato (infra/docs/contracts/events/rabbit.md) las
    # hace iguales al campo "type" del envelope, así que el publicador usa el mismo valor para los
    # dos.
    routing:
      email-send: email.send
      housekeeping-ticket: housekeeping.ticket
      voucher-gen: voucher.gen
  kafka:
    topic:
      reservations-events: reservations.events

logging:
  level:
    cl.andesstay: DEBUG
    org.springframework.security: INFO
